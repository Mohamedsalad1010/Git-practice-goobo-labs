name: GitHub Actions Practice - Lesson 9

on: push

jobs:
  assignment-check:
    name: say-Hello 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Count Project Files and Display Greeting
        env:
          STUDENT_NAME: ${{ vars.STUDENT_NAME }}
        run: |
          COUNT=$(find . -type f -not -path './.git/*' | wc -l)
          echo "======================================"
          echo "🚀 GitHub Actions Practice - Lesson 9"
          echo "👋 Hello, $STUDENT_NAME!"
          echo "📂 Total project files: $COUNT"
          echo "✅ Workflow executed successfully."
          echo "======================================"